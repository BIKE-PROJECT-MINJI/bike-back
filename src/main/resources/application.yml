spring:
  application:
    name: bike-back

  datasource:
    url: ${SPRING_DATASOURCE_URL:${DATABASE_URL:}}
    username: ${SPRING_DATASOURCE_USERNAME:${PGUSER:}}
    password: ${SPRING_DATASOURCE_PASSWORD:${PGPASSWORD:}}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:10}
      connection-timeout: ${SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT_MS:5000}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          batch_size: ${HIBERNATE_JDBC_BATCH_SIZE:50}
        order_inserts: true

  flyway:
    enabled: true

  data:
    redis:
      connect-timeout: ${SPRING_DATA_REDIS_CONNECT_TIMEOUT:400ms}
      timeout: ${SPRING_DATA_REDIS_COMMAND_TIMEOUT:400ms}
      repositories:
        enabled: false

server:
  port: ${PORT:8080}
  forward-headers-strategy: ${SERVER_FORWARD_HEADERS_STRATEGY:framework}

management:
  server:
    port: ${MANAGEMENT_PORT:18081}
    address: ${MANAGEMENT_SERVER_ADDRESS:0.0.0.0}
  endpoints:
    web:
      exposure:
        include: health,prometheus
  prometheus:
    public-scrape-enabled: ${MANAGEMENT_PROMETHEUS_PUBLIC_SCRAPE_ENABLED:false}
    metrics:
      export:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http:
          server:
            requests: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

auth:
  jwt:
    secret: ${AUTH_JWT_SECRET}
    issuer: ${AUTH_JWT_ISSUER:bike-back}
    token-validity-sec: ${AUTH_JWT_TOKEN_VALIDITY_SEC:900}

address:
  search:
    provider: ${ADDRESS_SEARCH_PROVIDER:kakao}
    kakao:
      base-url: ${KAKAO_LOCAL_BASE_URL:https://dapi.kakao.com}
      rest-api-key: ${KAKAO_LOCAL_REST_API_KEY:}
    nominatim:
      base-url: ${NOMINATIM_BASE_URL:https://nominatim.openstreetmap.org}
      user-agent: ${NOMINATIM_USER_AGENT:BIKE-GAJA-local-prototype/1.0}

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://127.0.0.1:8081,http://localhost:8081}

weather:
  provider: ${WEATHER_PROVIDER:open-meteo}

routing:
  bicycle:
    provider: ${BICYCLE_ROUTING_PROVIDER:graphhopper}
    fake:
      enabled: ${BICYCLE_ROUTING_FAKE_ENABLED:false}
    kakao:
      base-url: ${KAKAO_MOBILITY_BASE_URL:https://apis-navi.kakaomobility.com}
      rest-api-key: ${KAKAO_MOBILITY_REST_API_KEY:}
    graphhopper:
      base-url: ${GRAPHHOPPER_BASE_URL:http://127.0.0.1:8989}
      hosted-base-url: ${GRAPHHOPPER_HOSTED_BASE_URL:}
      api-key: ${GRAPHHOPPER_API_KEY:}
      retry-max-attempts: ${GRAPHHOPPER_RETRY_MAX_ATTEMPTS:2}

ai-route:
  generation:
    quota:
      per-minute: ${AI_ROUTE_GENERATION_QUOTA_PER_MINUTE:3}
      per-day: ${AI_ROUTE_GENERATION_QUOTA_PER_DAY:30}
  websocket:
    allowed-origins: ${AI_ROUTE_WEBSOCKET_ALLOWED_ORIGINS:}

bike:
  app-role: ${BIKE_APP_ROLE:all}
  observability:
    logging:
      http:
        mode: ${BIKE_OBSERVABILITY_HTTP_LOG_MODE:SLOW_OR_ERROR}
        slow-threshold-ms: ${BIKE_OBSERVABILITY_HTTP_SLOW_THRESHOLD_MS:500}
        sample-rate: ${BIKE_OBSERVABILITY_HTTP_SAMPLE_RATE:0.0}
      operation:
        mode: ${BIKE_OBSERVABILITY_OPERATION_LOG_MODE:SLOW_OR_ERROR}
        slow-threshold-ms: ${BIKE_OBSERVABILITY_OPERATION_SLOW_THRESHOLD_MS:200}
        sample-rate: ${BIKE_OBSERVABILITY_OPERATION_SAMPLE_RATE:0.0}
  rate-limit:
    store: ${BIKE_RATE_LIMIT_STORE:redis}
  database:
    backpressure:
      enabled: ${BIKE_DATABASE_BACKPRESSURE_ENABLED:true}
      active-threshold-ratio: ${BIKE_DATABASE_BACKPRESSURE_ACTIVE_THRESHOLD_RATIO:1.0}
      pending-threshold: ${BIKE_DATABASE_BACKPRESSURE_PENDING_THRESHOLD:1}
      message: ${BIKE_DATABASE_BACKPRESSURE_MESSAGE:데이터베이스 처리량이 일시적으로 부족합니다. 잠시 후 다시 시도해 주세요.}
  ride:
    save:
      gate:
        enabled: ${BIKE_RIDE_SAVE_GATE_ENABLED:true}
        max-concurrency: ${BIKE_RIDE_SAVE_GATE_MAX_CONCURRENCY:10}
        retry-after-seconds: ${BIKE_RIDE_SAVE_GATE_RETRY_AFTER_SECONDS:3}
        message: ${BIKE_RIDE_SAVE_GATE_MESSAGE:주행 기록 저장 요청이 많습니다. 로컬 기록을 유지하고 잠시 후 다시 저장해 주세요.}
  async:
    core-pool-size: ${BIKE_ASYNC_CORE_POOL_SIZE:4}
    max-pool-size: ${BIKE_ASYNC_MAX_POOL_SIZE:8}
    queue-capacity: ${BIKE_ASYNC_QUEUE_CAPACITY:500}
