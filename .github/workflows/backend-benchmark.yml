name: bike-back-benchmark

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

permissions:
  contents: read

concurrency:
  group: bike-back-benchmark
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install k6
        run: |
          set -euo pipefail
          K6_VERSION="v0.52.0"
          ARCH="amd64"
          mkdir -p /tmp/k6
          curl -fsSL "https://github.com/grafana/k6/releases/download/${K6_VERSION}/k6-${K6_VERSION}-linux-${ARCH}.tar.gz" | tar -xz -C /tmp/k6 --strip-components=1
          sudo mv /tmp/k6/k6 /usr/local/bin/k6
          k6 version

      - name: Run benchmark
        run: |
          mkdir -p ops/loadtest/results
          k6 run ops/loadtest/k6/bike-api.js \
            --env BASE_URL=http://3.35.168.38:8080 \
            --env SCENARIO=smoke \
            --env PERSONAS=home,preRide,inRide,health \
            --env SUMMARY_DIR=ops/loadtest/results

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-${{ github.run_id }}
          path: ops/loadtest/results/
          retention-days: 30

      - name: Print benchmark summary
        if: always()
        run: |
          echo '=== Benchmark Summary ==='
          cat ops/loadtest/results/*-summary.json 2>/dev/null || echo 'No summary file found'
