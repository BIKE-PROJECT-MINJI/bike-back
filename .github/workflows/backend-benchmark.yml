name: bike-back-benchmark

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

permissions:
  contents: read

concurrency:
  group: bike-back-benchmark
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install k6
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gpg
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq k6

      - name: Run benchmark
        run: |
          mkdir -p ops/loadtest/results
          k6 run ops/loadtest/k6/bike-api.js \
            --env BASE_URL=https://gajabike.shop \
            --env SCENARIO=smoke \
            --env PERSONAS=home,preRide,inRide,health \
            --env SUMMARY_DIR=ops/loadtest/results

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-${{ github.run_id }}
          path: ops/loadtest/results/
          retention-days: 30

      - name: Print benchmark summary
        if: always()
        run: |
          echo '=== Benchmark Summary ==='
          cat ops/loadtest/results/*-summary.json 2>/dev/null || echo 'No summary file found'
